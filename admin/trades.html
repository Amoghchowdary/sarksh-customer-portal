<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#005d3b" />
  <meta name="description" content="SARKSH secure customer and administration portal." />
  <title>Trade Management | SARKSH Admin</title>
  <link rel="icon" type="image/png" href="../assets/logo/sarksh-logo-web.png" />
  <link rel="stylesheet" href="../css/app.css" />
<meta name="robots" content="noindex,nofollow"/></head>
<body><div class="app-shell admin-shell">
<aside class="sidebar"><a class="side-brand" href="dashboard.html"><img src="../assets/logo/sarksh-logo-web.png" alt="SARKSH"/><span>SARKSH</span></a><p class="side-caption">CONTROL CENTRE</p><nav><a href="dashboard.html">Dashboard</a><a href="customers.html">Customers</a><a href="kyc-live.html">Live KYC Desk</a><a href="kyc.html">KYC Records</a><a class="active" href="trades.html">Trade Management</a><a href="accounts.html">Accounts & Ledger</a><a href="monitoring.html">Monitoring</a><a href="reports.html">Reports</a><a href="agreements.html">Agreement</a><a href="admins.html">Admins</a><a href="audit.html">Audit Logs</a></nav><div class="side-bottom"><button class="btn ghost full" data-logout>Sign Out</button></div></aside>
<main class="main"><header class="topbar"><button class="menu-btn" data-menu>☰</button><div><p class="eyebrow">ADMIN</p><h1>Trade Management</h1></div></header>
<section class="content-grid">
<article class="panel"><p class="eyebrow">MANUAL ENTRY</p><h2>Add trade</h2>
<form id="tradeForm" class="stack">
<div class="grid2"><label>Customer ID<input name="customer_id" required /></label><label>Symbol<input name="symbol" required /></label></div>
<div class="grid2"><label>Exchange<select name="exchange"><option>NSE</option><option>BSE</option></select></label><label>Trade Type<select name="trade_type"><option>BUY</option><option>SELL</option></select></label></div>
<div class="grid2"><label>Quantity<input name="quantity" type="number" min="1" required /></label><label>Status<select name="status"><option>OPEN</option><option selected>CLOSED</option></select></label></div>
<div class="grid2"><label>Entry Price<input name="entry_price" type="number" step="0.01" required /></label><label>Exit Price<input name="exit_price" type="number" step="0.01" /></label></div>
<div class="grid2"><label>Charges<input name="charges" type="number" min="0" step="0.01" value="0" /></label><label>Trade Date<input name="trade_date" type="date" required /></label></div>
<div class="calc-box"><span>Calculated Net P&L</span><strong id="previewPnl">₹0.00</strong></div>
<button class="btn primary" type="submit">Save Trade</button>
</form><div id="message" class="form-message"></div></article>
<article class="panel span2"><div class="panel-head"><div><p class="eyebrow">RECENT</p><h2>Trade register</h2></div><input id="tradeSearch" placeholder="Search…" /></div><div class="table-wrap"><table><thead><tr><th>ID</th><th>Customer</th><th>Date</th><th>Symbol</th><th>Qty</th><th>Net P&L</th><th>Status</th></tr></thead><tbody id="adminTradeRows"><tr><td colspan="7">Loading…</td></tr></tbody></table></div></article>
</section></main></div>

  <script src="../js/app.js?v=5.0.0"></script>
</body></html>
