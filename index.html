<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#005d3b" />
  <meta name="description" content="SARKSH secure customer and administration portal." />
  <title>SARKSH Portal</title>
  <link rel="icon" type="image/png" href="assets/logo/sarksh-logo-web.png" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body class="auth-body">
  <main class="auth-shell">
    <section class="brand-panel">
      <img src="assets/logo/sarksh-logo-web.png" class="brand-logo large" alt="SARKSH logo" />
      <div>
        <p class="eyebrow">SARKSH</p>
        <h1>The Change.</h1>
        <p class="muted light">Secure customer access, verification, account monitoring and trade visibility.</p>
      </div>
    </section>
    <section class="auth-card">
      <span class="status-pill success">Secure Portal</span>
      <h2>Choose access</h2>
      <p class="muted">Continue to the customer portal or the administration control centre.</p>
      <div class="stack gap16">
        <a class="btn primary full" href="login.html">Customer Login</a>
        <a class="btn secondary full" href="admin/login.html">Admin Login</a>
        <a class="btn ghost full" href="register.html">New Customer Registration</a>
      </div>
    </section>
  </main>
  <script src="js/app.js?v=6.0.0"></script>
</body>
</html>
