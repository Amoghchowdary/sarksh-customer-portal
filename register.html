<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#005d3b" />
  <meta name="description" content="SARKSH secure customer and administration portal." />
  <title>Register | SARKSH</title>
  <link rel="icon" type="image/png" href="assets/logo/sarksh-logo-web.png" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body class="auth-body">
  <main class="auth-shell">
    <section class="brand-panel">
      <img src="assets/logo/sarksh-logo-web.png" class="brand-logo large" alt="SARKSH logo" />
      <div>
        <p class="eyebrow">REGISTRATION</p>
        <h1>One account. A clear record.</h1>
        <p class="muted light">Create your portal account first. KYC is completed after secure sign-in.</p>
      </div>
    </section>
    <section class="auth-card">
      <a class="text-link" href="index.html">← Back</a>
      <h2>Create customer account</h2>
      <form id="registerForm" class="stack">
        <div class="grid2">
          <label>Full name<input name="full_name" required autocomplete="name" /></label>
          <label>Mobile<input name="mobile" required inputmode="numeric" pattern="[0-9]{10,15}" /></label>
        </div>
        <label>Email<input name="email" type="email" required autocomplete="email" /></label>
        <label>Password<input name="password" type="password" minlength="8" required autocomplete="new-password" /></label>
        <label>Confirm password<input name="confirm_password" type="password" minlength="8" required autocomplete="new-password" /></label>
        <label class="checkbox"><input name="consent" type="checkbox" required /> <span>I agree to the portal terms and privacy notice.</span></label>
        <button class="btn primary full" type="submit">Create Account</button>
      </form>
      <div id="message" class="form-message" aria-live="polite"></div>
    </section>
  </main>
  
  
  
  <script src="js/app.js?v=3.0.0"></script>
</body>
</html>
