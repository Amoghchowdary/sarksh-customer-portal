name: Build and Deploy SARKSH Portal

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build deployment
        run: |
          rm -rf dist
          mkdir -p dist

          cp index.html dist/
          cp login.html dist/
          cp register.html dist/
          cp dashboard.html dist/
          cp trades.html dist/
          cp kyc.html dist/
          cp 404.html dist/
          cp robots.txt dist/

          cp -R admin dist/admin
          cp -R assets dist/assets
          cp -R css dist/css
          cp -R js dist/js

          touch dist/.nojekyll

          if [ -f CNAME ]; then
            cp CNAME dist/CNAME
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4